# ADR-006／ADR-007 に伴うRegistry追加案（**未適用のDraft**）
#
# このファイルは design-source/registries/ の正本ではない。
# 承認後に各正本YAMLへ取り込み、tools/build_registry_snapshot.py と
# tools/generate_domain_registry_code.py を再実行する。
# delegation-floor.yaml と masking-policy.yaml も任意の補助ファイルではなく、
# snapshot／source hash／生成コード／Verifierの対象へ必ず統合する。
#
# 現行の正本件数（registry-snapshot.json の totals）
#   event_type_count: 63 / error_code_count: 52 / state_namespace_count: 25
#   core_schema_count: 20 / case_count: 86 / gate_count: 36
#
# 本Draft適用後の件数は build_registry_snapshot.py の出力を正とし、
# ここにも本文にも手入力しない（不変条件#18）。

snapshot_integration:
  mode: MANDATORY
  policy_registries:
    - file: delegation-floor.yaml
      snapshot_key: policy_registries.delegation_floor
    - file: masking-policy.yaml
      snapshot_key: policy_registries.masking_policy
  canonicalization: JSON_SORTED_COMPACT_UTF8_V1
  source_hash_required: true
  generator_required: true
  verifier_required: true
  missing_policy_registry: FAIL_CLOSED

# ---------------------------------------------------------------------------
# events.yaml へ追記する Event Type
# ---------------------------------------------------------------------------
event_types_added:
  # ADR-006 段階的委任
  - DELEGATION_CREATED         # 人間の承認でDelegationGrantを発行した
  - DELEGATION_MATCHED         # Predicateが成立し自動承認へ進んだ
  - DELEGATION_REJECTED        # Predicate不成立。人間承認へ戻した
  - DELEGATION_NARROWED        # 範囲を縮小し旧GrantをSUPERSEDEDにした
  - DELEGATION_REVOKED         # 明示失効
  - DELEGATION_EXPIRED         # 期限またはmax_uses到達
  - DELEGATION_INVALIDATED     # policy/schema/token profile Hash変化による失効
  - DELEGATION_REVALIDATED     # 最終Effect Gateでの再検証に成功（ADR-006 §5.4）
  - DELEGATION_EFFECT_LINEARIZED # SQLite CASがEffect開始線形化点を確定
  - DELEGATION_REVOKED_AFTER_EFFECT_START # 線形化後の失効を監査記録
  # ADR-007 マスキング
  - INPUT_MASKING_STARTED
  - INPUT_MASKING_SCAN1_CANDIDATES_READY # 決定論Scan#1の候補Spanを確定
  - INPUT_MASKING_SPANS_PROPOSED   # LLMがSpanを返した（本文は返さない）
  - INPUT_MASKING_COMPLETED
  - INPUT_MASKING_REJECTED

# ---------------------------------------------------------------------------
# errors.yaml へ追記する Error Code
# ---------------------------------------------------------------------------
error_codes_added:
  # ADR-006
  - error_code: DELEGATION_SCOPE_EXCEEDED
    classification: POLICY_DENIED
    note: Predicateの範囲外。narrowで部分集合になっていない場合も含む
  - error_code: DELEGATION_SELF_MODIFICATION_DENIED
    classification: POLICY_DENIED
    note: 委任による委任の作成・拡大・変更（ADR-006 §6-9）
  - error_code: DELEGATION_NOT_DELEGABLE_ACTION
    classification: POLICY_DENIED
    note: 非委任床（有償・外部送信・Recovery・HIGH以上等）へ触れた
  - error_code: DELEGATION_EXPIRED
    classification: APPROVAL_REQUIRED
  - error_code: DELEGATION_REVOKED
    classification: APPROVAL_REQUIRED
  - error_code: DELEGATION_SIGNATURE_INVALID
    classification: AUTHENTICATION_ERROR
  - error_code: DELEGATION_PREDICATE_AMBIGUOUS
    classification: VALIDATION_ERROR
    note: 同率に狭い複数Grantが一致。順序依存を避けるため不成立とする
  - error_code: DELEGATION_TRUST_ANCHOR_INVALID
    classification: AUTHENTICATION_ERROR
    note: Trust Anchor不一致・Rotation未検証・Rollback検出（ADR-006 §7）
  - error_code: DELEGATION_SUBJECT_MISMATCH
    classification: AUTHENTICATION_ERROR
    note: Audience／Tenant／Issuer不一致
  - error_code: DELEGATION_REVOKED_MID_FLIGHT
    classification: CONFLICT
    note: >
      Approval消費後・Effect確定前に失効を検出（ADR-006 §5.4）。
      最終Effect GateのCASで検出しEffect実行前に停止する
  - error_code: DELEGATION_REVOKED_AFTER_EFFECT_START
    classification: CONFLICT
    note: Effect線形化後に失効。外部Effectの結果確認またはReconciliationを要求
  # ADR-007（Span提案方式。v1の MASKING_TRANSFORMATION_INVALID は廃案）
  - error_code: MASKING_VERIFICATION_FAILED
    classification: POLICY_DENIED
    note: マスク後の決定論スキャン#2が不合格（過少マスク）
  - error_code: MASKING_SPAN_INVALID
    classification: VALIDATION_ERROR
    note: 範囲外・逆転・重複・入れ子・Span数超過
  - error_code: MASKING_CATEGORY_UNKNOWN
    classification: VALIDATION_ERROR
    note: masking-policy.yaml へ未登録のカテゴリ
  - error_code: MASKING_RATIO_EXCEEDED
    classification: POLICY_DENIED
    note: マスク比率が上限超過。全文塗り潰しによる偽装の検出
  - error_code: MASKER_OUTPUT_MALFORMED
    classification: VALIDATION_ERROR
    note: 非JSON・未知Field・source_normalized_hash不一致
  - error_code: MASKER_UNAVAILABLE
    classification: POLICY_DENIED
    note: 停止・Timeout・隔離要件不成立。マスクなしで通さずFail-Closed
  - error_code: MASKING_GRAPHEME_SPLIT
    classification: VALIDATION_ERROR
    note: Spanが保守的なGrapheme risky codepoint guardに該当するためReject
  - error_code: MASKING_NORMALIZATION_PROFILE_MISMATCH
    classification: VALIDATION_ERROR
    note: NFC ProfileまたはUnicode data versionが入力とMaskerで不一致
  - error_code: MASKING_NORMALIZATION_ARTIFACT_MISSING
    classification: VALIDATION_ERROR
    note: UCD 14.0割当済み符号位置集合Artifactが欠落・Hash不一致
  - error_code: MASKING_UNSUPPORTED_CODEPOINT
    classification: VALIDATION_ERROR
    note: UCD 14.0未割当符号位置を正規化前に検出
  - error_code: MASKING_SPAN_CONFLICT
    classification: VALIDATION_ERROR
    note: 同一カテゴリContainment以外の部分重複、複数候補包含、カテゴリ衝突
  - error_code: MASKER_ISOLATION_INCOMPLETE
    classification: POLICY_DENIED
    note: egress／telemetry／prompt log／core dump／mlock等の強制条件未成立

# ---------------------------------------------------------------------------
# states.yaml へ追記する State名空間
# ---------------------------------------------------------------------------
state_namespaces_added:
  DELEGATION_GRANT: [ACTIVE, EXPIRED, REVOKED, SUPERSEDED, INVALIDATED]
  MASKING_RESULT: [CLEAN, MASKED, REJECTED]

# requested／issued／consumed はLedger Eventであり、長寿命Stateへ追加しない。
# Effect線形化はActionAttempt側の既存StateとEventで表現する。

# ---------------------------------------------------------------------------
# schemas.yaml へ追記する Core Schema
# ---------------------------------------------------------------------------
core_schemas_added:
  - schema_name: DelegationGrant
    schema_version: 1.0.0
    path: schemas/core/DelegationGrant/1.0.0.schema.json
  - schema_name: MaskingReceipt
    schema_version: 1.0.0
    path: schemas/core/MaskingReceipt/1.0.0.schema.json
    required_fields:
      - source_content_hash
      - source_normalized_hash
      - normalization_profile
      - normalization_profile_artifact_hash
      - scan1_candidate_span_count
      - spans
      - span_validation_result
      - scan2_result
      - masking_policy_version

# 既存Schemaの変更（Minor）
core_schemas_modified:
  - schema_name: ApprovalGrant
    change: |
      approval_mode: HUMAN | POLICY_DELEGATED を必須追加。
      delegation_id を Schema Conditional で追加
      （approval_mode=POLICY_DELEGATED のとき必須、HUMAN のとき null）。
    impacts: AT-SCHEMA-CONDITIONAL-001 へCase追加が必要
  - schema_name: ContextSelectionReceipt
    change: masking_receipt_ids（マスクを経たFragmentの参照）を追加
  - schema_name: RuntimeEnvelopeSpec
    change: masker_provider / masker_model / masker_model_digest / masker_instruction_hash /
      normalization_profile / normalization_profile_artifact_hash /
      masker_isolation_attestation_hash を追加

