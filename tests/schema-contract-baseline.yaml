# Schema契約のBaseline（tools/check_schema_contract.py）。
#
# spec/20-schemas/<Name>.md の必須Field列と
# schemas/core/<Name>/<ver>.schema.json の properties / required の乖離を固定する。
#
# resolved         : 乖離0を要求するSchema@Version。是正したらここへ移す
# known_divergence : 既知の乖離。**増えたら落ちる**。件数ではなく全Field名を列挙する
#
# 終了Code 0 は「乖離が無い」ではなく「既知の乖離から増えていない」を意味する。
# 検査範囲はRequired Field関連の2種類だけであり、型・Enum・Pattern・
# additionalProperties・条件付き必須は未検査（Owner Decision D-Q7で段階拡張）。
